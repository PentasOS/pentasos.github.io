<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PentasOS — операционная система, написанная с нуля</title>
<meta name="description" content="PentasOS — ОС с нуля: UEFI-загрузчик, ядро на C, PE32+, GUI и шелл.">
<style>
  :root {
    --bg: #0b0d12;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #6c5ce7;
    --accent-2: #00d2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Top panel ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(11, 13, 18, 0.8);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.5px;
  }
  nav ul {
    display: flex;
    gap: 28px;
    list-style: none;
    font-size: 0.95rem;
    color: var(--muted);
  }
  nav ul a:hover { color: var(--text); }

  /* ---------- Hero ---------- */
  .hero {
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 100px 24px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: -40% -20% auto;
    height: 600px;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(108,92,231,0.25), transparent 60%),
      radial-gradient(ellipse at 70% 0%, rgba(0,210,255,0.18), transparent 60%);
    pointer-events: none;
  }
  .hero h1 {
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    line-height: 1.15;
    font-weight: 800;
    position: relative;
  }
  .hero h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    max-width: 720px;
    margin: 26px auto 0;
    font-size: clamp(1.2rem, 3vw, 1.55rem);
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    position: relative;
  }
  .hero p .now {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p .soon {
    color: var(--muted);
    font-weight: 500;
  }

  @media (max-width: 640px) {
    nav ul { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="#">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M14 2 26 11 21 25 7 25 2 11Z" fill="url(#g)"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="28" y2="28">
            <stop stop-color="#6c5ce7"/>
            <stop offset="1" stop-color="#00d2ff"/>
          </linearGradient>
        </defs>
      </svg>
      PentasOS
    </a>
  </div>
</header>

<section class="hero">
  <h1>PentasOS</h1>
  <p>Пока поддерживает <span class="now">EXE (Windows)</span>.<br>
  <span class="soon">В скором будущем — APK (Android) и ELF (Linux).</span></p>
</section>

</body>
</html>
